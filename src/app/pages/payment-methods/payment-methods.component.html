<nav aria-label="breadcrumb" class="position-relative">
  <ol class="breadcrumb">
    <li aria-current="page" class="breadcrumb-item active">Metodi di pagamento</li>
  </ol>
  <button color="primary" class="btn-download btn btn-primary" (click)="openDialog()">
    <i class="ri-add-line"></i> Aggiungi metodo
  </button>
</nav>

<mat-card class="trinta-card to-do-list-card mb-25 bg-white border-none d-block">
  <mat-card-content>
    <div class="to-do-list-table">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="pl-0">Metodo</th>
            <td mat-cell *matCellDef="let element" class="pl-0" data-label="Metodo">
              <div class="position-relative"><h6 class="mt-0 mb-0">{{ element.name }}</h6></div>
            </td>
          </ng-container>
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef class="pl-0">Ordine</th>
            <td mat-cell *matCellDef="let element" class="pl-0" data-label="Ordine">
              <div class="position-relative"><h6 class="mt-0 mb-0">{{ element.position }}</h6></div>
            </td>
          </ng-container>
          <ng-container matColumnDef="enabled">
            <th mat-header-cell *matHeaderCellDef class="pl-0">Stato</th>
            <td mat-cell *matCellDef="let element" class="pl-0" data-label="Stato">
              <div class="position-relative"><h6 class="mt-0 mb-0">{{ element.enabled ? 'Attivo' : 'Disattivato' }}</h6></div>
            </td>
          </ng-container>
          <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef class="text-center pr-0">Modifica</th>
            <td mat-cell *matCellDef="let element" class="text-center pr-0" data-label="Modifica">
              <div class="action">
                <button type="button" mat-button class="p-0 min-w-auto lh-1 h-auto" (click)="openDialog(element)">
                  <i class="{{ element.action?.edit }}"></i>
                </button>
              </div>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center no-data" [attr.colspan]="displayedColumns.length">Nessun metodo inserito</td>
          </tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[20, 50, 100]"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
